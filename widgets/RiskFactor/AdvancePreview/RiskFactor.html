<style>
/* RiskFactor Widget Preview - Carbon Design System */
/* Colors and typography aligned with themes/Carbon.less */

.riskfactor-container {
  width: 100%;
  font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; /* @bpm-font-family-sans-serif */
}

.risk-display {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 4px;
  background: #ffffff; /* @bpm-body-bg */
  border: 1px solid #e0e0e0; /* Gray 20 */
  transition: all 0.2s ease;
}

.risk-display:hover {
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

.risk-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.risk-icon svg {
  display: block;
}

.risk-icon.small svg {
  width: 24px;
  height: 24px;
}

.risk-icon.medium svg {
  width: 32px;
  height: 32px;
}

.risk-icon.large svg {
  width: 48px;
  height: 48px;
}

.risk-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.risk-label {
  font-size: 14px; /* @bpm-font-size-base */
  font-weight: 600; /* @bpm-font-weight-semibold */
  color: #161616; /* @bpm-text-color */
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.risk-score {
  font-size: 12px; /* @bpm-font-size-small */
  font-weight: 400; /* @bpm-font-weight-normal */
  color: #525252; /* Gray 70 */
}

.risk-display.low {
  background: #d4edda;
  border-color: #198038; /* @bpm-color-success */
}

.risk-display.low .risk-icon svg {
  fill: #198038; /* @bpm-color-success */
}

.risk-display.low .risk-label {
  color: #198038; /* @bpm-color-success */
}

.risk-display.normal {
  background: #d0e2ff;
  border-color: #0043ce; /* @bpm-link-text-color-hover */
}

.risk-display.normal .risk-icon svg {
  fill: #0043ce; /* @bpm-link-text-color-hover */
}

.risk-display.normal .risk-label {
  color: #0043ce; /* @bpm-link-text-color-hover */
}

.risk-display.high {
  background: #ffd7d9;
  border-color: #da1e28; /* @bpm-color-alert */
}

.risk-display.high .risk-icon svg {
  fill: #da1e28; /* @bpm-color-alert */
}

.risk-display.high .risk-label {
  color: #da1e28; /* @bpm-color-alert */
}

.risk-display.critical {
  background: #ffb3b8;
  border-color: #a2191f;
}

.risk-display.critical .risk-icon svg {
  fill: #a2191f;
}

.risk-display.critical .risk-label {
  color: #a2191f;
}

.risk-display.high .risk-icon svg,
.risk-display.critical .risk-icon svg {
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.6;
  }
}

.preview-examples {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 16px;
}

.preview-example {
  padding: 12px;
  background: #f4f4f4; /* Gray 10 */
  border-radius: 4px;
}

.preview-example h4 {
  margin: 0 0 8px 0;
  font-size: 12px; /* @bpm-font-size-small */
  color: #525252; /* Gray 70 */
  text-transform: uppercase;
}
</style>

<div class="SPARKPanel panel">
    <div class="widget-heading">
        <span class="widget-title">Risk Factor Preview</span>
    </div>
    <div class="widget-body">
        <!-- Preview content generated by RiskFactorSnippet.js -->
    </div>
</div>
