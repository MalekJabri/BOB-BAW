<style>
/* ProcessCircle Widget Preview Styles - Carbon Design System */

@keyframes growProgressBar {
    0%, 33% {
        --pgPercentage: 0;
    }
    100% {
        --pgPercentage: calc((var(--value) - var(--min)) / (var(--max) - var(--min)) * 100);
    }
}

@property --pgPercentage {
    syntax: '<number>';
    inherits: true;
    initial-value: 0;
}

.process-circle-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

.process-circle {
    /* CSS Custom Properties */
    --size: 0.5rem;
    --circle-size: 12rem;
    --min: 0;
    --max: 100;
    --value: 0;
    --pgPercentage: 0;
    
    /* Carbon Design System Colors */
    --color-success: #198038;
    --color-warning: #f1c21b;
    --color-error: #da1e28;
    --color-bg: #e0e0e0;
    --color-text: #161616;
    
    /* Layout */
    width: var(--circle-size);
    height: var(--circle-size);
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    
    /* Background ring */
    background: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--size)),
        var(--color-bg) 0
    );
    
    /* Typography */
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--color-text);
    
    /* Animation */
    animation: growProgressBar 2s ease-out forwards;
}

.process-circle::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: var(--size);
    
    background:
        linear-gradient(var(--color-error) 0 0) 0/calc((var(--pgPercentage) - 70) * 1px) 100%,
        linear-gradient(var(--color-warning) 0 0) 0/calc((var(--pgPercentage) - 50) * 1px) 100%,
        var(--color-success);
    
    --_mask:
        conic-gradient(#000 calc(var(--pgPercentage) * 1%), transparent 0),
        linear-gradient(#000 0 0) content-box;
    -webkit-mask: var(--_mask);
    mask: var(--_mask);
    -webkit-mask-composite: source-out;
    mask-composite: subtract;
}

.process-circle::before {
    content: attr(aria-valuenow) attr(data-post);
    position: relative;
    z-index: 1;
    text-align: center;
}
</style>

<div class="SPARKPanel panel">
    <div class="widget-heading">
        <span class="widget-title">ProcessCircle Preview</span>
    </div>
    <div class="widget-body">
        <!-- Preview content generated by ProcessCircleSnippet.js -->
    </div>
</div>
