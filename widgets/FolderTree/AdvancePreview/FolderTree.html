<style>
/* FolderTree Widget Preview Styles */
/* Scoped to widget preview - integrates with BAW Designer */

.ufm-widget {
  font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; /* @bpm-font-family-sans-serif */
  font-size: 14px; /* @bpm-font-size-base */
  color: #161616; /* @bpm-text-color */
  width: 100%;
  box-sizing: border-box;
}

.ufm-widget *,
.ufm-widget *::before,
.ufm-widget *::after {
  box-sizing: border-box;
}

/* Main Container */
.ufm-container {
  display: block;
  padding: 16px;
  background-color: #ffffff; /* @bpm-body-bg */
  border: 1px solid #e0e0e0; /* Gray 20 */
  border-radius: 4px;
  min-height: 300px;
}

/* Files Panel */
.ufm-files-panel {
  width: 100%;
}

/* Files Header */
.ufm-files-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #e0e0e0; /* Gray 20 */
}

.ufm-files-title {
  font-size: 16px;
  font-weight: 600; /* @bpm-font-weight-semibold */
  color: #161616; /* @bpm-text-color */
  margin: 0;
}

.ufm-refresh-btn {
  background: transparent;
  border: 1px solid #c6c6c6; /* Gray 30 */
  border-radius: 4px;
  cursor: pointer;
  padding: 6px 12px;
  color: #525252; /* Gray 70 */
  min-width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 110ms cubic-bezier(0.2, 0, 0.38, 0.9);
}

.ufm-refresh-btn:hover {
  background-color: #f4f4f4; /* Gray 10 */
}

.ufm-refresh-icon {
  font-size: 20px;
  line-height: 1;
}

/* Selection Controls */
.ufm-selection-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #e0e0e0; /* Gray 20 */
  font-size: 13px;
}

.ufm-select-all-btn,
.ufm-unselect-all-btn {
  background: transparent;
  border: none;
  color: #525252; /* Gray 70 */
  cursor: pointer;
  padding: 4px 8px;
  font-size: 13px;
  transition: color 110ms cubic-bezier(0.2, 0, 0.38, 0.9);
}

.ufm-select-all-btn:hover,
.ufm-unselect-all-btn:hover {
  color: #0f62fe; /* @bpm-color-primary */
  text-decoration: underline;
}

.ufm-separator {
  color: #a8a8a8; /* Gray 40 */
}

.ufm-file-count {
  margin-left: auto;
  color: #525252; /* Gray 70 */
}

/* Files List */
.ufm-files-list {
  overflow-y: auto;
  max-height: 300px;
  width: 100%;
}

.ufm-file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid #e0e0e0; /* Gray 20 */
  margin-bottom: 4px;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 110ms cubic-bezier(0.2, 0, 0.38, 0.9);
}

.ufm-file-item:hover {
  background-color: #f4f4f4; /* Gray 10 */
}

.ufm-file-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #0f62fe; /* @bpm-color-primary */
}

.ufm-file-item span {
  font-size: 14px; /* @bpm-font-size-base */
  color: #161616; /* @bpm-text-color */
}
</style>

<div class="SPARKPanel panel">
    <div class="widget-heading">
        <span class="widget-title">Folder Tree Preview</span>
    </div>
    <div class="widget-body">
        <!-- Preview content generated by FolderTreeSnippet.js -->
    </div>
</div>
