<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#f4f4f4"/>
  
  <!-- Timeline vertical line -->
  <line x1="25" y1="15" x2="25" y2="105" stroke="#e0e0e0" stroke-width="3"/>
  
  <!-- Activity 1 - Completed (top) -->
  <circle cx="25" cy="25" r="12" fill="#198038" stroke="#198038" stroke-width="3"/>
  <path d="M 20 25 L 23 28 L 30 21" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="45" y="18" width="60" height="5" fill="#161616" rx="2.5"/>
  <rect x="45" y="25" width="45" height="3" fill="#525252" rx="1.5"/>
  <rect x="95" y="19" width="18" height="8" fill="#defbe6" rx="4"/>
  
  <!-- Activity 2 - Active (middle) -->
  <circle cx="25" cy="60" r="12" fill="#0f62fe" stroke="#0f62fe" stroke-width="3"/>
  <circle cx="25" cy="60" r="5" fill="white"/>
  <rect x="45" y="53" width="60" height="5" fill="#0f62fe" rx="2.5"/>
  <rect x="45" y="60" width="50" height="3" fill="#525252" rx="1.5"/>
  <rect x="95" y="54" width="18" height="8" fill="#d0e2ff" rx="4"/>
  
  <!-- Activity 3 - Pending (bottom) -->
  <circle cx="25" cy="95" r="12" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="3"/>
  <circle cx="25" cy="95" r="5" fill="#c6c6c6"/>
  <rect x="45" y="88" width="55" height="5" fill="#525252" rx="2.5"/>
  <rect x="45" y="95" width="40" height="3" fill="#8d8d8d" rx="1.5"/>
  <rect x="95" y="89" width="18" height="8" fill="#e0e0e0" rx="4"/>
  
  <!-- Process indicators -->
  <circle cx="25" cy="25" r="14" fill="none" stroke="#198038" stroke-width="1" opacity="0.2"/>
  <circle cx="25" cy="60" r="16" fill="none" stroke="#0f62fe" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Decorative process flow arrows -->
  <path d="M 25 37 L 25 48" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M 25 72 L 25 83" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="2,2"/>
</svg>

